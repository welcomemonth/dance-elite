# =============================================================================
# dance-elite 生产部署编排
#
# 用法：
#   docker compose -f scripts/docker-compose.yml up -d
#   docker compose -f scripts/docker-compose.yml logs -f
#   docker compose -f scripts/docker-compose.yml down
#
# 配置分两处：
#   - 非敏感运行参数：宿主机上的 config.yaml（模板见仓库根 config.yaml），
#     只读挂载到容器内 /etc/dance-elite/config.yaml；其中 server.port 必须为
#     8090（与端口映射、健康检查一致）；
#   - 密钥与微信账户：环境变量文件（模板见仓库根 .env.example，不入库），
#     默认读取 ../.env，可用 ELITE_ENV_FILE 指定绝对路径。
#
# 常用覆盖（写在 shell 环境或同目录 .env 中）：
#   HOST_PORT=18080       宿主机端口（默认 18080，容器内固定 8090）
#   ELITE_DATA_DIR=/data/dance-elite   持久化目录（默认 ./data，相对本文件）
#   ELITE_CONFIG_FILE=/etc/dance-elite/config.yaml  非敏感配置文件（必填；
#                          模板见 scripts/config.prod.example.yaml）
#   ELITE_IMAGE_TAG=1.0.0 镜像版本（默认 latest）
# =============================================================================

name: dance-elite

services:
  app:
    image: ${ELITE_IMAGE_REPO:-crpi-npw0av7ozhtwtzou.cn-hangzhou.personal.cr.aliyuncs.com/memos_meetmonth/dance-elite-json}:${ELITE_IMAGE_TAG:-latest}
    container_name: dance-elite
    restart: unless-stopped

    ports:
      # 容器内监听 8090（由挂载的 config.yaml server.port 决定），只映射宿主机端口
      - "${HOST_PORT:-18080}:8090"

    environment:
      # 全库时间字符串与赛事状态自动流转按 Asia/Shanghai 计算
      # （internal/utils/time.go:15），镜像默认 TZ=UTC，必须覆盖
      TZ: Asia/Shanghai
      # 生产固定为 prod：支付材料必须完整，绝不自动回退 mock
      APP_ENV: prod
      CONFIG_FILE: /etc/dance-elite/config.yaml

    env_file:
      # JWT_SECRET / ID_CARD_HMAC_KEY / WECHAT_* / ADMIN_INIT_PASSWORD 等
      # 缺失时容器启动即 fail-fast，日志一次性列出缺失项
      - ${ELITE_ENV_FILE:-../.env}

    volumes:
      # 非敏感配置单独挂载（只读）；必须显式指定，避免误用本地开发配置。
      # server.port 必须为 8090。
      - ${ELITE_CONFIG_FILE:?ELITE_CONFIG_FILE is required}:/etc/dance-elite/config.yaml:ro
      # WORKDIR 与 VOLUME 均为 /opt/dance-elite，卷内路径由 config.yaml 的
      # storage.db_path / storage.upload_dir 决定，挂载宿主目录即完成 SQLite
      # 与上传文件的持久化
      - ${ELITE_DATA_DIR:-./data}:/opt/dance-elite

    healthcheck:
      # 与 config.yaml 的 server.port 保持一致（生产配置固定 8090）
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/api/v1/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # server.Run 用 context 驱动优雅关闭，留足在途请求时间
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
