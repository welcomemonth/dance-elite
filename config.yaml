# 非敏感运行配置（入库）。密钥与微信账户参数只经环境变量注入，见 .env.example。
#
# 本文件是本地开发默认值；生产部署时挂载一份独立 config.yaml，并把
# APP_ENV 设为 prod、public_base_url 填真实域名、日志改为 info/json。

server:
  port: 10350
  # 对外访问地址（微信支付回调、音频审核/抽签外链）；prod 必填，形如 https://api.example.com
  public_base_url: "https://tilt.tunnel.meetmonth.top"
  # 慢请求阈值（毫秒），超过时访问日志升为 WARN；0 关闭
  slow_request_ms: 500

storage:
  # SQLite 文件与上传目录；生产挂 volume 持久化
  db_path: data/dance-elite.db
  upload_dir: uploads

log:
  level: debug      # debug/info/warn/error；生产改为 info
  format: console   # json/console；生产改为 json

auth:
  # 登录态有效期（秒）
  jwt_expire_seconds: 7200

admin:
  # 后台初始超管（仅首次启动建档，已存在账号不覆盖）
  init_username: admin

scheduler:
  # 赛事状态自动流转轮询间隔（秒）
  status_tick_seconds: 60
  # 待支付订单超时（分钟）：先查单，确认未支付才系统取消
  order_expire_minutes: 15
  # 退款卡死判定窗口（分钟）：超时无回调时主动查询微信退款单
  refund_watchdog_minutes: 10

sms:
  # 抽签提醒/结果短信：true 时只记录脱敏日志、不调用阿里云（本地联调用）。
  # 真实发送的凭据只从环境变量读取：SMS_ACCESS_KEY_ID / SMS_ACCESS_KEY_SECRET / SMS_SIGN_NAME。
  mock: true
